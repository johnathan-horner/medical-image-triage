name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: pip install flake8 && flake8 --max-line-length 120 --ignore E501,W503 app.py mcp_server.py
      - name: Test imports
        run: python -c "import app; print('app.py imports OK')"
      - name: Test MCP server imports
        run: python -c "import mcp_server; print('mcp_server.py imports OK')"